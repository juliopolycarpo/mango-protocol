name: Fuzz

on:
  schedule:
    # 03:17 UTC daily: off the hour, so it does not compete with every other
    # project's midnight cron for shared runner capacity.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: decode_line
            features: ""
            extra_args: ""
          - target: line_decoder_push
            features: ""
            extra_args: ""
          - target: chunk_reassembler_push
            # The default libFuzzer -max_len (~4096) never reaches a
            # multi-chunk message; the chunk framing's own floor is 2048.
            features: ""
            extra_args: "-max_len=65536"
          - target: validate
            features: ""
            extra_args: ""
          - target: catalog_parse
            features: ""
            extra_args: ""
          - target: session_frames
            # Needs the session and the port seam; see fuzz/Cargo.toml.
            features: "tokio"
            extra_args: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # fuzz/ deliberately targets nightly, unlike the rest of the repo (see
      # its own rust-toolchain.toml note in docs/conformance.md); libFuzzer
      # instrumentation needs `-Z` flags only nightly accepts.
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: cargo-fuzz
      - name: Run ${{ matrix.target }} for 5 minutes
        working-directory: fuzz
        run: |
          set -euo pipefail
          features=()
          if [ -n "${{ matrix.features }}" ]; then
            features=(--features "${{ matrix.features }}")
          fi
          cargo +nightly fuzz run "${features[@]}" ${{ matrix.target }} -- \
            -max_total_time=300 -timeout=30 ${{ matrix.extra_args }}
      - name: Upload the corpus and any crashing input
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}
          path: |
            fuzz/corpus/${{ matrix.target }}
            fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 14
